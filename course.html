<div id="app">
  <div class="boot">Loading…</div>
</div>
<script>
  /*
   * Boot watchdog. If any ES module fails to load or link (blocked by a content
   * blocker, a stale cached copy, a network error), the browser silently skips
   * the whole app and "Loading…" stays forever. This plain script is not a
   * module, so it still runs and explains what happened.
   */
  (function () {
    var problems = [];
    var shown = false;

    window.addEventListener('error', function (event) {
      if (window.__courseStarted) return;
      var target = event.target;
      if (target && target !== window && (target.src || target.href)) {
        // The browser only blames the entry script; walk its imports to name
        // the file that actually failed.
        var entry = target.src || target.href;
        findBroken(entry, {}).then(function (broken) {
          (broken.length ? broken : [entry]).forEach(function (url) {
            problems.push('Yuklanmadi / Не загрузилось: ' + url.replace(location.origin, ''));
          });
          show();
        });
        return;
      } else {
        var where = event.filename ? ' — ' + event.filename.replace(location.origin, '') + ':' + event.lineno : '';
        problems.push((event.message || 'Error') + where);
      }
      setTimeout(show, 50);
    }, true);

    window.addEventListener('load', function () {
      setTimeout(function () { if (!window.__courseStarted) show(); }, 4000);
    });

    function findBroken(url, seen) {
      if (seen[url] || Object.keys(seen).length > 80) return Promise.resolve([]);
      seen[url] = true;
      return fetch(url, { cache: 'no-store' }).then(function (response) {
        if (!response.ok) return [url + ' (' + response.status + ')'];
        return response.text().then(function (code) {
          var found = [];
          // Only real statements at the start of a line — lesson content has
          // example imports inside string literals.
          var pattern = /^\s*(?:import|export)\s[^'"`;]*?from\s*['"](\.{1,2}\/[^'"]+)['"]|^\s*import\s*['"](\.{1,2}\/[^'"]+)['"]/gm;
          var match;
          while ((match = pattern.exec(code))) found.push(new URL(match[1] || match[2], url).href);
          return Promise.all(found.map(function (next) { return findBroken(next, seen); }))
            .then(function (lists) { return [].concat.apply([], lists); });
        });
      }, function () { return [url]; });
    }

    function show() {
      if (shown || window.__courseStarted) return;
      shown = true;
      var box = document.querySelector('#app');
      if (!box) return;
      var list = problems.length ? problems : ['src/main.js ishga tushmadi / не запустился'];
      box.innerHTML =
        '<div class="boot"><h2>Kursni ishga tushirib bo‘lmadi · Не удалось запустить курс</h2>' +
        '<pre class="boot__error"></pre>' +
        '<ol>' +
        '<li>Sahifani keshsiz qayta yuklang · Перезагрузите без кеша: <b>Cmd+Option+R</b> (Safari), <b>Cmd+Shift+R</b> / <b>Ctrl+Shift+R</b></li>' +
        '<li>Reklama bloklovchi / content blocker kengaytmalarini shu sayt uchun o‘chiring · Отключите блокировщики для этого сайта ' +
        '(Safari: <b>View → Reload Without Content Blockers</b>)</li>' +
        '<li>Sahifani <code>npm start</code> orqali oching · Откройте через <code>npm start</code>: <code>http://localhost:4173/course.html</code></li>' +
        '</ol></div>';
      box.querySelector('.boot__error').textContent = list.join('\n');
    }
  })();
</script>
<script type="module" src="./src/main.js"></script>
</body>
